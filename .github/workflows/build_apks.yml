name: Build PhoneGuard APKs

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build 5 APKs
        run: |
          set -e
          for p in SimGuard AdbGuard LoginGuard AppLock "Intrusion/Intrusion"; do
            name=$(basename "$p")
            echo "=== Building $name ==="
            (cd "apps/$p" && gradle assembleRelease --no-daemon -x lint -x lintVitalRelease)
          done
          echo "=== APK 产物 ==="
          find apps -path '*outputs/apk/release/*.apk' -exec ls -la {} \;

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: phoneguard-apks
          path: apps/**/outputs/apk/release/*.apk
          retention-days: 30
