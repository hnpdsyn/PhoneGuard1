name: Build PhoneGuard APKs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build 5 APKs
        run: |
          set -e
          for p in SimGuard AdbGuard LoginGuard AppLock "Intrusion" "SecurityLog"; do
            name=$(basename "$p")
            echo "=== Building $name ==="
            (cd "apps/$p" && gradle assembleRelease --no-daemon -x lint -x lintVitalRelease)
          done
          echo "=== APK 产物 ==="
          find apps -path '*outputs/apk/release/*.apk' -exec ls -la {} \;

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.2-sms-alert -R hnpdsyn/PhoneGuard1 >/dev/null 2>&1 || \
            gh release create v1.2-sms-alert -R hnpdsyn/PhoneGuard1 \
              --title "PhoneGuard v1.1/v1.2 入侵短信告警版" \
              --notes "5 个 App 升级版，全部新增入侵短信告警。⚠️ 需先卸载旧版再安装（签名更换）。"
          find apps -path '*outputs/apk/release/*.apk' -name '*.apk' | while read f; do
            echo "Uploading $(basename "$f")"
            gh release upload v1.2-sms-alert "$f" -R hnpdsyn/PhoneGuard1 --clobber
          done

      - name: Upload APKs (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: phoneguard-apks
          path: apps/**/outputs/apk/release/*.apk
          retention-days: 30
